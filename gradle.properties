# The default 512 MB heap thrashes when R8 shrinks the release and benchmark builds
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# One JVM per build: a separate Kotlin daemon doubled the memory and, with a stale
# daemon from another Gradle version, ran this 16 GB machine out of memory
kotlin.compiler.execution.strategy=in-process
# Project-wide Gradle settings.

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Enable non-transitive R classes
android.nonTransitiveRClass=true

# Enable BuildConfig generation
android.defaults.buildfeatures.buildconfig=true
